spring:
  application:
    name: ecommerce-backend

  data:
    mongodb:
      # MongoDB connection URI with Docker Compose service hostname 'mongodb' by default.
      # For local standalone development outside Docker, set MONGODB_URI=mongodb://localhost:27017/ecommerce_db
      uri: ${MONGODB_URI:mongodb://mongodb:27017/ecommerce_db?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000}
      # Index creation is managed operationally or enabled via environment variable
      auto-index-creation: ${AUTO_INDEX_CREATION:false}
    redis:
      # Redis host and port with Docker Compose service hostname 'redis' by default.
      # For local standalone development outside Docker, set REDIS_HOST=localhost
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

server:
  # Configurable via environment variable PORT; defaults to 8080 for local development.
  # Note: Spring Boot automatically maps the SERVER_PORT environment variable to server.port as well.
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  # Signing secret for HMAC-SHA256 (HS256). Must be at least 256 bits (32 bytes).
  secret: ${JWT_SECRET:c2NhbGFibGUtZWNvbW1lcmNlLXN5c3RlbS1zdXBlci1zZWNyZXQta2V5LTIwMjY=}
  # Token validity duration in milliseconds (default: 15 minutes = 900,000 ms)
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
