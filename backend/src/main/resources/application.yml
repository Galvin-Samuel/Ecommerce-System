spring:
  application:
    name: ecommerce-backend

server:
  # Configurable via environment variable PORT; defaults to 8080 for local development.
  # Note: Spring Boot automatically maps the SERVER_PORT environment variable to server.port as well.
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

