spring:
  application:
    name: ecommerce-backend

  data:
    mongodb:
      # MongoDB connection URI with Docker Compose service hostname 'mongodb' by default.
      # For local standalone development outside Docker, set MONGODB_URI=mongodb://localhost:27017/ecommerce_db
      uri: ${MONGODB_URI:mongodb://mongodb:27017/ecommerce_db?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000}
      # Index creation is managed operationally or enabled via environment variable
      auto-index-creation: ${AUTO_INDEX_CREATION:false}
    redis:
      # Redis host and port with Docker Compose service hostname 'redis' by default.
      # For local standalone development outside Docker, set REDIS_HOST=localhost
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

server:
  # Configurable via environment variable PORT; defaults to 8080 for local development.
  # Note: Spring Boot automatically maps the SERVER_PORT environment variable to server.port as well.
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  # Signing secret for HMAC-SHA256 (HS256). Must be at least 256 bits (32 bytes).
  secret: ${JWT_SECRET:c2NhbGFibGUtZWNvbW1lcmNlLXN5c3RlbS1zdXBlci1zZWNyZXQta2V5LTIwMjY=}
  # Token validity duration in milliseconds (default: 15 minutes = 900,000 ms)
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

app:
  cache:
    # TTL for individual product detail entries (default: 10 minutes)
    product-ttl-minutes: ${PRODUCT_CACHE_TTL_MINUTES:10}
    # TTL for catalog searches and listings (default: 5 minutes)
    search-ttl-minutes: ${SEARCH_CACHE_TTL_MINUTES:5}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    trust-proxy: ${RATE_LIMITING_TRUST_PROXY:false}
    fallback-policy: ${RATE_LIMITING_FALLBACK_POLICY:FAIL_OPEN}
    rules:
      auth:
        limit: ${RATE_LIMIT_AUTH_LIMIT:10}
        window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
      orders:
        limit: ${RATE_LIMIT_ORDERS_LIMIT:15}
        window-seconds: ${RATE_LIMIT_ORDERS_WINDOW:60}
      api-default:
        limit: ${RATE_LIMIT_DEFAULT_LIMIT:60}
        window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW:60}
  id-generator:
    enabled: ${ID_GENERATOR_ENABLED:true}
    datacenter-id: ${ID_GENERATOR_DATACENTER_ID:1}
    worker-id: ${ID_GENERATOR_WORKER_ID:1}
    custom-epoch-ms: ${ID_GENERATOR_EPOCH_MS:1767225600000}
    max-backward-ms: ${ID_GENERATOR_MAX_BACKWARD_MS:10}



